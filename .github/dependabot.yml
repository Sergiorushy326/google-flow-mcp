version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x does not support TypeScript 7 yet, so a grouped
      # TS major bump breaks `npm ci` on peer resolution. Lift this once
      # typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # zod 4 is a breaking change and the MCP SDK's schema handling is built
      # against zod 3. Bump deliberately, not automatically.
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      # @types/node must not run ahead of the oldest Node we claim to support
      # (engines: >=20). Newer types would silently accept APIs that do not
      # exist on Node 20, and CI would not catch it. Raise this only together
      # with the engines field.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
